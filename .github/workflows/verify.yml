name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:resources

  unit-tests:
    runs-on: ubuntu-24.04
    # One shard can take over 15 minutes on a slow hosted runner when its failure diagnosis reruns the heaviest files one at a time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # unit-test-totals expects one report from each of these four shards.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Naming reporters replaces vitest's defaults, so github-actions is listed to keep failure annotations.
      - name: Run unit-test shard ${{ matrix.shard }} of 4
        id: unit
        run: pnpm test --shard=${{ matrix.shard }}/4 --reporter=default --reporter=github-actions --reporter=blob --outputFile.blob="$RUNNER_TEMP/vitest-blob/blob-${{ matrix.shard }}-4-attempt-${{ github.run_attempt }}.json"
      # A failed shard still writes its report, so the merged summary shows the failure.
      # Artifact IDs do not follow upload order and a download keeps only the highest ID of a name,
      # so each run attempt keeps its report under a name of its own.
      - name: Retain unit-test shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vitest-blob/blob-${{ matrix.shard }}-4-attempt-${{ github.run_attempt }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Diagnose failed unit checks without changing their result
        if: failure() && steps.unit.outcome == 'failure'
        run: |
          node -e 'const os=require("node:os");console.log(JSON.stringify({node:process.version,availableParallelism:os.availableParallelism(),memoryBytes:os.totalmem(),load:os.loadavg()}))'
          df -h . /tmp
          pnpm test src/server/restore-recovery.test.ts src/server/test-job-manager.test.ts src/server/infrastructure/sqlite/durable-migrations.test.ts src/server/infrastructure/sqlite/sqlite-state-store.test.ts --maxWorkers=1 --reporter=json --outputFile=unit-failure-diagnostic.json
      - name: Retain unit failure timings
        if: failure() && steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-failure-diagnostic-shard-${{ matrix.shard }}
          path: unit-failure-diagnostic.json
          retention-days: 7
          if-no-files-found: warn

  unit-test-totals:
    needs: unit-tests
    # Also runs after a failed shard, so the merged summary shows every result; that failure still fails this job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: unit-test-blob-*
          merge-multiple: true
          path: ${{ runner.temp }}/vitest-blobs
      # Merging silently accepts a partial set of reports, and a shard run again keeps the reports of its earlier attempts.
      - name: Require every shard report and keep the latest attempt of each
        run: node scripts/unit-test-totals.mjs blobs "$RUNNER_TEMP/vitest-blobs" 4 "$RUNNER_TEMP/vitest-blobs-latest"
      - name: List unit-test files of the configuration
        run: pnpm exec vitest list --filesOnly --json="$RUNNER_TEMP/unit-test-files.json"
      - name: Merge shard reports
        run: pnpm exec vitest run --merge-reports="$RUNNER_TEMP/vitest-blobs-latest" --reporter=default --reporter=./scripts/unit-test-totals.mjs --outputFile.totals="$RUNNER_TEMP/unit-test-durations.json"
      - name: Require every listed file in the merged report
        run: node scripts/unit-test-totals.mjs files "$RUNNER_TEMP/unit-test-files.json" "$RUNNER_TEMP/unit-test-durations.json"
      # One name per run attempt, so a download by name gets the durations of that attempt.
      - name: Retain unit-test durations per file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-durations-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-test-durations.json
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Artifacts drop file modes; the archive keeps the executable CLI entries that npm pack ships.
      - name: Archive build output
        run: tar -cf "$RUNNER_TEMP/build-output.tar" dist out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output.tar
          retention-days: 1
          if-no-files-found: error

  https-tests:
    needs: build
    runs-on: ubuntu-24.04
    # Browser dependencies have downloaded for over ten minutes from a slow APT mirror.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Restore build output
        run: tar -xpf "$RUNNER_TEMP/build-output/build-output.tar"
      - name: Install verified Caddy fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl -fsSL -o "$RUNNER_TEMP/caddy/caddy.tar.gz" https://github.com/caddyserver/caddy/releases/download/v2.11.3/caddy_2.11.3_linux_amd64.tar.gz
          echo "ee886eceda0ff9f30610d3be9b5b594026591e19add6b3961a341c72abe468e5eac9d7c2c2450bbb8420db1f827b954521f9336be4872f81090b8618adf8815a  $RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - name: Use Ubuntu HTTPS mirrors for browser dependencies
        shell: bash
        run: |
          # Azure's mirror delivered ~26 MB at ~40 kB/s in both attempts of run 40330287767.
          # Speed-up only: drop the plain-HTTP Azure mirror when the runner image lists
          # HTTPS fallbacks behind it (actions/runner-images, configure-apt-sources.sh).
          # Any other layout keeps the image's package sources unchanged and is printed,
          # so a new image never fails the build here (image 20261103.629 varied by runner).
          mirrors=/etc/apt/apt-mirrors.txt
          sources=/etc/apt/sources.list.d/ubuntu.sources
          azure='^http://([a-z0-9-]+\.)?azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]'
          if grep -Fxq 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' "$sources" 2>/dev/null &&
             grep -Eq "$azure" "$mirrors" 2>/dev/null &&
             grep -Ev "$azure" "$mirrors" | grep -q '^https://'; then
            sudo sed -E -i "\|$azure|d" "$mirrors"
            echo 'APT mirrors in use:'
            cat "$mirrors"
          else
            echo '::warning::Unrecognized Ubuntu APT mirror layout; keeping the runner image package sources.'
            grep -H '' "$sources" "$mirrors" 2>/dev/null || true
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:https

  # The suite drives the built CLI and controller with Node, Git and OpenSSL only; it starts no browser and no Caddy.
  integration-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Restore build output
        run: tar -xpf "$RUNNER_TEMP/build-output/build-output.tar"
      - run: pnpm test:integration

  ui-tests:
    needs: build
    runs-on: ubuntu-24.04
    # Browser dependencies have downloaded for over ten minutes from a slow APT mirror, before a suite of about seven minutes.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Restore build output
        run: tar -xpf "$RUNNER_TEMP/build-output/build-output.tar"
      # test:ui has no fingerprint check of its own; the dashboard it loads must come from these sources.
      - name: Check build output against the sources
        run: node scripts/build-fingerprint.mjs --check
      - name: Use Ubuntu HTTPS mirrors for browser dependencies
        shell: bash
        run: |
          # Azure's mirror delivered ~26 MB at ~40 kB/s in both attempts of run 40330287767.
          # Speed-up only: drop the plain-HTTP Azure mirror when the runner image lists
          # HTTPS fallbacks behind it (actions/runner-images, configure-apt-sources.sh).
          # Any other layout keeps the image's package sources unchanged and is printed,
          # so a new image never fails the build here (image 20261103.629 varied by runner).
          mirrors=/etc/apt/apt-mirrors.txt
          sources=/etc/apt/sources.list.d/ubuntu.sources
          azure='^http://([a-z0-9-]+\.)?azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]'
          if grep -Fxq 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' "$sources" 2>/dev/null &&
             grep -Eq "$azure" "$mirrors" 2>/dev/null &&
             grep -Ev "$azure" "$mirrors" | grep -q '^https://'; then
            sudo sed -E -i "\|$azure|d" "$mirrors"
            echo 'APT mirrors in use:'
            cat "$mirrors"
          else
            echo '::warning::Unrecognized Ubuntu APT mirror layout; keeping the runner image package sources.'
            grep -H '' "$sources" "$mirrors" 2>/dev/null || true
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics-ui
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-tests:
    needs: build
    runs-on: ubuntu-24.04
    # Browser dependencies have downloaded for over ten minutes from a slow APT mirror.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Restore build output
        run: tar -xpf "$RUNNER_TEMP/build-output/build-output.tar"
      - name: Use Ubuntu HTTPS mirrors for browser dependencies
        shell: bash
        run: |
          # Azure's mirror delivered ~26 MB at ~40 kB/s in both attempts of run 40330287767.
          # Speed-up only: drop the plain-HTTP Azure mirror when the runner image lists
          # HTTPS fallbacks behind it (actions/runner-images, configure-apt-sources.sh).
          # Any other layout keeps the image's package sources unchanged and is printed,
          # so a new image never fails the build here (image 20261103.629 varied by runner).
          mirrors=/etc/apt/apt-mirrors.txt
          sources=/etc/apt/sources.list.d/ubuntu.sources
          azure='^http://([a-z0-9-]+\.)?azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]'
          if grep -Fxq 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' "$sources" 2>/dev/null &&
             grep -Eq "$azure" "$mirrors" 2>/dev/null &&
             grep -Ev "$azure" "$mirrors" | grep -q '^https://'; then
            sudo sed -E -i "\|$azure|d" "$mirrors"
            echo 'APT mirrors in use:'
            cat "$mirrors"
          else
            echo '::warning::Unrecognized Ubuntu APT mirror layout; keeping the runner image package sources.'
            grep -H '' "$sources" "$mirrors" 2>/dev/null || true
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics-e2e
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  package-artifacts:
    # The two packages exist only when every check of this run passed.
    needs: [static-checks, unit-tests, unit-test-totals, build, https-tests, integration-tests, ui-tests, e2e-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Downloaded outside the workspace: both packers record any untracked file as a dirty source.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output
      - name: Restore build output
        run: tar -xpf "$RUNNER_TEMP/build-output/build-output.tar"
      # A separate artifact, never part of portable-package. Written outside the
      # workspace and before the Community pack, so both clean-tree checks hold.
      - name: Pack optional account provider
        run: node scripts/package-provider.mjs --output "$RUNNER_TEMP/provider-artifact" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optional-auth-provider
          path: ${{ runner.temp }}/provider-artifact/
          retention-days: 7
          if-no-files-found: error
      - name: Pack verified application
        shell: bash
        run: |
          node scripts/package-trial.mjs \
            --output portable-artifact \
            --commit "$GITHUB_SHA" \
            --verification-target ubuntu-24.04-linux-x64-node22.23.2 \
            --verification-target ubuntu-24.04-linux-x64-node24.21.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-package
          path: portable-artifact/
          retention-days: 7
          if-no-files-found: error

  package-rbac-acceptance:
    # Exact CI artifacts in fresh prefixes; the checkout supplies only the harness.
    needs: package-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          # The checkout supplies the harness; artifacts install with npm only.
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: portable-package
          path: portable-artifact
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: optional-auth-provider
          path: provider-artifact
      - name: Upgrade public 0.1.1 and install fresh with the separate provider
        shell: bash
        run: |
          (cd portable-artifact && sha256sum --check SHA256SUMS)
          (cd provider-artifact && sha256sum --check worktree-control-provider-SHA256SUMS)
          TARBALL=$(node -p 'require("./portable-artifact/provenance.json").artifact.filename')
          SHA256=$(node -p 'require("./portable-artifact/provenance.json").artifact.sha256')
          for BASELINE in public-0.1.1 fresh; do
            node scripts/package-rbac.mjs --baseline "$BASELINE" \
              --community "portable-artifact/$TARBALL" --community-sha256 "$SHA256" \
              --provider-dir provider-artifact --report "rbac-acceptance-$BASELINE.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rbac-acceptance-reports
          path: rbac-acceptance-*.json
          retention-days: 7
          if-no-files-found: ignore

  systemd-drop-in-acceptance:
    # This job mutates service scopes and must stay on its own disposable hosted VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable user service manager
        shell: bash
        run: |
          USER_ID=$(id -u)
          sudo systemctl start "user@$USER_ID.service"
          test -S "/run/user/$USER_ID/bus"
          echo "XDG_RUNTIME_DIR=/run/user/$USER_ID" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$USER_ID/bus" >> "$GITHUB_ENV"
          printf '%s\n' 'worktree-control test fixture only' | sudo tee /run/worktree-control-disposable-systemd >/dev/null
      - name: Verify inspected drop-ins against the real disposable manager
        env:
          WORKTREE_CONTROL_ISOLATED_SYSTEMD_ACCEPTANCE: disposable
        run: pnpm exec tsx scripts/systemd-drop-in-acceptance.ts --report systemd-drop-in-acceptance-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: systemd-drop-in-acceptance-report
          path: systemd-drop-in-acceptance-report.json
          retention-days: 7
          if-no-files-found: error

  package-smoke:
    needs: package-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2, 24.21.0]
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: portable-package
          path: portable-artifact
      - name: Verify provenance and smoke installed artifact
        shell: bash
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p=require("./portable-artifact/provenance.json");for(const [f,want] of [[p.artifact.filename,p.artifact.sha256],[p.files.smoke,p.files.smokeSha256],[p.files.installer,p.files.installerSha256],[p.files.lifecycle,p.files.lifecycleSha256]]){const got=c.createHash("sha256").update(fs.readFileSync(`portable-artifact/${f}`)).digest("hex");if(got!==want)throw Error(`checksum mismatch: ${f}`)}const sums=fs.readFileSync("portable-artifact/SHA256SUMS","utf8").trim();if(sums!==[[p.artifact.filename,p.artifact.sha256],[p.files.smoke,p.files.smokeSha256],[p.files.installer,p.files.installerSha256],[p.files.lifecycle,p.files.lifecycleSha256]].map(([f,h])=>`${h}  ${f}`).join("\n"))throw Error("SHA256SUMS does not match provenance")'
          TARBALL=$(node -p 'require("./portable-artifact/provenance.json").artifact.filename')
          SHA256=$(node -p 'require("./portable-artifact/provenance.json").artifact.sha256')
          node portable-artifact/package-smoke.mjs --tarball "portable-artifact/$TARBALL" --sha256 "$SHA256" --report "portable-smoke-report-node-${{ matrix.node }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: portable-smoke-report-node-${{ matrix.node }}
          path: portable-smoke-report-node-${{ matrix.node }}.json
          retention-days: 7
          if-no-files-found: ignore

  package-service-lifecycle:
    needs: package-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: portable-package
          path: portable-artifact
      - name: Start disposable user service manager
        shell: bash
        run: |
          USER_ID=$(id -u)
          sudo systemctl start "user@$USER_ID.service"
          test -S "/run/user/$USER_ID/bus"
          echo "XDG_RUNTIME_DIR=/run/user/$USER_ID" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$USER_ID/bus" >> "$GITHUB_ENV"
      - name: Verify packaged systemd lifecycle
        shell: bash
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p=require("./portable-artifact/provenance.json");for(const [f,want] of [[p.artifact.filename,p.artifact.sha256],[p.files.lifecycle,p.files.lifecycleSha256]]){const got=c.createHash("sha256").update(fs.readFileSync(`portable-artifact/${f}`)).digest("hex");if(got!==want)throw Error(`checksum mismatch: ${f}`)}'
          TARBALL=$(node -p 'require("./portable-artifact/provenance.json").artifact.filename')
          SHA256=$(node -p 'require("./portable-artifact/provenance.json").artifact.sha256')
          USER_ID=$(id -u)
          TRIAL_ROOT="$RUNNER_TEMP/worktree-control lifecycle trial"
          mkdir -p -m 700 "$TRIAL_ROOT" "$TRIAL_ROOT/prefix" "$TRIAL_ROOT/data" "$TRIAL_ROOT/state" "$TRIAL_ROOT/projects"
          READY="$TRIAL_ROOT/session-ready"
          CONTINUE="$TRIAL_ROOT/session-continue"
          HARNESS_PID=""
          cleanup_harness() {
            if test -n "$HARNESS_PID" && kill -0 "$HARNESS_PID" 2>/dev/null; then
              touch "$CONTINUE"
              wait "$HARNESS_PID" || true
            fi
          }
          trap cleanup_harness EXIT
          node portable-artifact/package-lifecycle-trial.mjs \
            --candidate "portable-artifact/$TARBALL" \
            --candidate-sha256 "$SHA256" \
            --provenance portable-artifact/provenance.json \
            --prefix "$TRIAL_ROOT/prefix" \
            --data-dir "$TRIAL_ROOT/data" \
            --state-dir "$TRIAL_ROOT/state" \
            --browse-root "$TRIAL_ROOT/projects" \
            --expected-uid "$USER_ID" \
            --session-ready "$READY" \
            --session-continue "$CONTINUE" \
            --report "$GITHUB_WORKSPACE/package-lifecycle-report.json" &
          HARNESS_PID=$!
          for _ in $(seq 1 180); do
            test -f "$READY" && break
            kill -0 "$HARNESS_PID" 2>/dev/null || { wait "$HARNESS_PID"; exit $?; }
            sleep 0.5
          done
          test -f "$READY"
          sudo systemctl stop "user@$USER_ID.service"
          sudo systemctl start "user@$USER_ID.service"
          for _ in $(seq 1 60); do
            test -S "/run/user/$USER_ID/bus" && break
            sleep 0.5
          done
          test -S "/run/user/$USER_ID/bus"
          touch "$CONTINUE"
          wait "$HARNESS_PID"
          HARNESS_PID=""
          trap - EXIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: package-lifecycle-report
          path: package-lifecycle-report.json
          retention-days: 7
          if-no-files-found: ignore
