name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        id: check
      - name: Diagnose failed unit checks without changing their result
        if: failure() && steps.check.outcome == 'failure'
        run: |
          node -e 'const os=require("node:os");console.log(JSON.stringify({node:process.version,availableParallelism:os.availableParallelism(),memoryBytes:os.totalmem(),load:os.loadavg()}))'
          df -h . /tmp
          pnpm test src/server/restore-recovery.test.ts src/server/test-job-manager.test.ts src/server/infrastructure/sqlite/durable-migrations.test.ts src/server/infrastructure/sqlite/sqlite-state-store.test.ts --maxWorkers=1 --reporter=json --outputFile=unit-failure-diagnostic.json
      - name: Retain unit failure timings
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-failure-diagnostic
          path: unit-failure-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm build
      - name: Install verified Caddy fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl -fsSL -o "$RUNNER_TEMP/caddy/caddy.tar.gz" https://github.com/caddyserver/caddy/releases/download/v2.11.3/caddy_2.11.3_linux_amd64.tar.gz
          echo "ee886eceda0ff9f30610d3be9b5b594026591e19add6b3961a341c72abe468e5eac9d7c2c2450bbb8420db1f827b954521f9336be4872f81090b8618adf8815a  $RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:https
      - run: pnpm test:integration
      - run: pnpm test:ui
      - run: pnpm test:e2e
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Pack verified application
        shell: bash
        run: |
          node scripts/package-trial.mjs \
            --output portable-artifact \
            --commit "$GITHUB_SHA" \
            --verification-target ubuntu-24.04-linux-x64-node22.23.2 \
            --verification-target ubuntu-24.04-linux-x64-node24.21.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-package
          path: portable-artifact/
          retention-days: 7
          if-no-files-found: error

  package-smoke:
    needs: check-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.2, 24.21.0]
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: portable-package
          path: portable-artifact
      - name: Verify provenance and smoke installed artifact
        shell: bash
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p=require("./portable-artifact/provenance.json");for(const [f,want] of [[p.artifact.filename,p.artifact.sha256],[p.files.smoke,p.files.smokeSha256],[p.files.installer,p.files.installerSha256],[p.files.lifecycle,p.files.lifecycleSha256]]){const got=c.createHash("sha256").update(fs.readFileSync(`portable-artifact/${f}`)).digest("hex");if(got!==want)throw Error(`checksum mismatch: ${f}`)}const sums=fs.readFileSync("portable-artifact/SHA256SUMS","utf8").trim();if(sums!==[[p.artifact.filename,p.artifact.sha256],[p.files.smoke,p.files.smokeSha256],[p.files.installer,p.files.installerSha256],[p.files.lifecycle,p.files.lifecycleSha256]].map(([f,h])=>`${h}  ${f}`).join("\n"))throw Error("SHA256SUMS does not match provenance")'
          TARBALL=$(node -p 'require("./portable-artifact/provenance.json").artifact.filename')
          SHA256=$(node -p 'require("./portable-artifact/provenance.json").artifact.sha256')
          node portable-artifact/package-smoke.mjs --tarball "portable-artifact/$TARBALL" --sha256 "$SHA256" --report "portable-smoke-report-node-${{ matrix.node }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: portable-smoke-report-node-${{ matrix.node }}
          path: portable-smoke-report-node-${{ matrix.node }}.json
          retention-days: 7
          if-no-files-found: ignore

  package-service-lifecycle:
    needs: check-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: portable-package
          path: portable-artifact
      - name: Start disposable user service manager
        shell: bash
        run: |
          USER_ID=$(id -u)
          sudo systemctl start "user@$USER_ID.service"
          test -S "/run/user/$USER_ID/bus"
          echo "XDG_RUNTIME_DIR=/run/user/$USER_ID" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$USER_ID/bus" >> "$GITHUB_ENV"
      - name: Verify packaged systemd lifecycle
        shell: bash
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),p=require("./portable-artifact/provenance.json");for(const [f,want] of [[p.artifact.filename,p.artifact.sha256],[p.files.lifecycle,p.files.lifecycleSha256]]){const got=c.createHash("sha256").update(fs.readFileSync(`portable-artifact/${f}`)).digest("hex");if(got!==want)throw Error(`checksum mismatch: ${f}`)}'
          TARBALL=$(node -p 'require("./portable-artifact/provenance.json").artifact.filename')
          SHA256=$(node -p 'require("./portable-artifact/provenance.json").artifact.sha256')
          USER_ID=$(id -u)
          TRIAL_ROOT="$RUNNER_TEMP/worktree-control lifecycle trial"
          mkdir -p -m 700 "$TRIAL_ROOT" "$TRIAL_ROOT/prefix" "$TRIAL_ROOT/data" "$TRIAL_ROOT/state" "$TRIAL_ROOT/projects"
          READY="$TRIAL_ROOT/session-ready"
          CONTINUE="$TRIAL_ROOT/session-continue"
          HARNESS_PID=""
          cleanup_harness() {
            if test -n "$HARNESS_PID" && kill -0 "$HARNESS_PID" 2>/dev/null; then
              touch "$CONTINUE"
              wait "$HARNESS_PID" || true
            fi
          }
          trap cleanup_harness EXIT
          node portable-artifact/package-lifecycle-trial.mjs \
            --candidate "portable-artifact/$TARBALL" \
            --candidate-sha256 "$SHA256" \
            --provenance portable-artifact/provenance.json \
            --prefix "$TRIAL_ROOT/prefix" \
            --data-dir "$TRIAL_ROOT/data" \
            --state-dir "$TRIAL_ROOT/state" \
            --browse-root "$TRIAL_ROOT/projects" \
            --expected-uid "$USER_ID" \
            --session-ready "$READY" \
            --session-continue "$CONTINUE" \
            --report "$GITHUB_WORKSPACE/package-lifecycle-report.json" &
          HARNESS_PID=$!
          for _ in $(seq 1 180); do
            test -f "$READY" && break
            kill -0 "$HARNESS_PID" 2>/dev/null || { wait "$HARNESS_PID"; exit $?; }
            sleep 0.5
          done
          test -f "$READY"
          sudo systemctl stop "user@$USER_ID.service"
          sudo systemctl start "user@$USER_ID.service"
          for _ in $(seq 1 60); do
            test -S "/run/user/$USER_ID/bus" && break
            sleep 0.5
          done
          test -S "/run/user/$USER_ID/bus"
          touch "$CONTINUE"
          wait "$HARNESS_PID"
          HARNESS_PID=""
          trap - EXIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: package-lifecycle-report
          path: package-lifecycle-report.json
          retention-days: 7
          if-no-files-found: ignore
