<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp: aktualny stan zadania przed historią</title>
<style>
/* Working interpretation of the approved charcoal/restrained-lime image; copied from ../../tokens.css so the file opens alone. */
:root{color-scheme:dark;--background:#181a18;--foreground:#ecefe6;--surface:#202320;--muted:#292d28;--muted-foreground:#b1b8ad;--primary:#c5e76c;--primary-foreground:#181a18;--accent-foreground:#c5e76c;--selected:#303a22;--border:#444b40;--ring:#c5e76c;--success:#a4d883;--warning:#f1c56c;--destructive:#ff9592;--radius:4px;--font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,monospace}
:root[data-theme="light"]{color-scheme:light;--background:#f6f7f2;--foreground:#20251b;--surface:#fff;--muted:#e9ecdf;--muted-foreground:#535e4d;--accent-foreground:#4f641b;--selected:#e6edcf;--border:#c9d0be;--ring:#4f641b;--success:#346425;--warning:#805109;--destructive:#ad3035}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:15px/1.5 var(--font-sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--muted-foreground)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Prototype controls: outside the mocked application */
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:12px 16px;border-bottom:1px dashed var(--border);background:var(--muted)}
.controls label{display:grid;gap:2px;font-size:12px;color:var(--muted-foreground)}
.controls select{font:inherit;font-size:14px;color:var(--foreground);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;min-height:34px}
.controls .note{flex-basis:100%;font-size:12px;color:var(--muted-foreground);margin:0}
.stage{padding:16px;display:flex;justify-content:center}
/* Mocked application frame */
.app{display:grid;grid-template-columns:84px 1fr;width:100%;max-width:1440px;min-height:860px;border:1px solid var(--border);background:var(--background)}
.app.mobile{grid-template-columns:1fr;max-width:390px}
.app.narrow{max-width:320px}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px}
.side .logo{color:var(--accent-foreground);font-weight:700;margin-bottom:12px}
.side .nav{display:grid;justify-items:center;gap:2px;font-size:12px;padding:10px 4px;border-radius:var(--radius);width:72px;color:var(--muted-foreground)}
.side .nav.on{background:var(--selected);color:var(--accent-foreground);box-shadow:inset 3px 0 var(--primary)}
.mobile .side{display:none}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);font-size:14px}
.top .crumb{color:var(--muted-foreground)}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--border)}
.tabs span{padding:10px 12px;font-size:14px;color:var(--muted-foreground)}
.tabs span.on{color:var(--foreground);box-shadow:inset 0 -2px var(--primary);font-weight:600}
.mobile .top,.mobile .tabs{padding-left:14px;padding-right:14px}
.work{display:grid;grid-template-columns:340px 1fr;flex:1;min-height:0}
.mobile .work{grid-template-columns:1fr}
.list{border-right:1px solid var(--border);margin:0;padding:0;list-style:none}
.mobile .list{display:none}
.list li a{display:block;padding:14px 16px;border-left:2px solid transparent;text-decoration:none;border-bottom:1px solid var(--border)}
.list li a[aria-current]{border-left-color:var(--primary);background:var(--selected)}
.list .t{display:block;font-weight:500}
.list .s{font-size:12px;color:var(--muted-foreground)}
.reader{min-width:0;overflow:auto}
.readerbar{display:none;padding:8px 10px;border-bottom:1px solid var(--border)}
.mobile .readerbar{display:block}
article{max-width:896px;margin:0 auto;padding:24px 28px 48px}
.mobile article{padding:16px 14px 40px}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.badge.blocked{border-color:color-mix(in srgb,var(--warning) 50%,transparent);color:var(--warning)}
.badge.done{color:var(--success)}
h1.title{font-size:26px;line-height:1.2;margin:10px 0 18px;letter-spacing:-.01em}
.mobile h1.title{font-size:21px}
/* Current state panel */
.state{border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:18px 20px}
.mobile .state{padding:14px}
.state-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground);margin:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;background:none;color:inherit;font:inherit;font-size:13px;cursor:pointer;min-height:30px}
.chip.ok{color:var(--success)}
.chip.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.meta{font-size:12px;color:var(--muted-foreground);margin:4px 0 0;flex-basis:100%}
.banner{margin:14px 0 0;border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);border-radius:var(--radius);padding:10px 12px;font-size:14px}
.banner ul{margin:6px 0 0;padding-left:18px}
.result{margin:16px 0 0}
.result dt{font-size:12px;color:var(--muted-foreground)}
.result dd{margin:2px 0 0;font-size:18px;line-height:1.45;max-width:70ch}
.mobile .result dd{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 0;padding:0}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mobile .grid{grid-template-columns:1fr}
.cell{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;min-width:0;margin:0}
.cell dt{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.cell dd{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.cell.warn{border-color:color-mix(in srgb,var(--warning) 60%,transparent)}
.cell.bad{border-color:color-mix(in srgb,var(--destructive) 60%,transparent)}
.cell .sub{display:block;font-size:12px;color:var(--muted-foreground);margin-top:4px}
.tone-ok{color:var(--success)}.tone-warn{color:var(--warning)}.tone-bad{color:var(--destructive)}.tone-unknown{color:var(--muted-foreground)}
.ico{display:inline-block;width:15px;height:15px;flex:none;vertical-align:-2px}
h2.sec{font-size:13px;margin:20px 0 6px;font-weight:600}
.delivery{margin:0;display:grid;grid-template-columns:max-content max-content 1fr max-content;gap:0 16px;font-size:14px}
.delivery>div{display:contents}
.delivery dt,.delivery dd{padding:7px 0;border-top:1px solid var(--border);margin:0}
.delivery dt{color:var(--muted-foreground)}
.delivery .st{display:flex;gap:6px;align-items:center}
.mobile .delivery{grid-template-columns:1fr auto}
.mobile .delivery .ver{grid-column:1 / -1;border-top:0;padding-top:0}
.mobile .delivery .src{grid-column:1 / -1;border-top:0;padding-top:0}
.summary-line{font-size:13px;color:var(--muted-foreground);margin:8px 0 0}
.findings{margin:16px 0 0;border-top:1px solid var(--border);padding-top:12px}
.findings ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.findings li{display:flex;gap:8px;font-size:14px}
.findings li .kind{font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.btn{font:inherit;font-size:14px;min-height:36px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border);background:none;color:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);font-weight:600}
.mobile .btn{min-height:44px}
.srclink{font-size:12px;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;min-height:24px}
.mobile .srclink{min-height:44px}
.sources{margin:10px 0 0;padding-left:18px;font-size:13px}
.sources li{margin:3px 0}
/* History */
.history{margin:28px 0 0;border-top:1px solid var(--border);padding-top:16px}
.history h2{font-size:18px;margin:0 0 10px}
.history h3{font-size:14px;margin:18px 0 6px}
.desc{white-space:pre-wrap;max-width:75ch;font-size:15px;line-height:1.7;margin:0}
.resolved li,.superseded li{font-size:14px;margin:4px 0}
.source-view{border:1px solid var(--border);border-radius:6px;padding:18px;background:var(--surface)}
.empty-facts{margin:14px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mobile .empty-facts{grid-template-columns:1fr 1fr}
.empty-facts div{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px}
.empty-facts b{display:block;font-size:18px}
.footer{display:flex;justify-content:space-between;padding:8px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
[hidden]{display:none!important}
/* Narrow embeds behave like the app: reader without the list or sidebar. */
@media (max-width:900px){.app{grid-template-columns:1fr}.side,.list{display:none}.work{grid-template-columns:1fr}.readerbar{display:block}.stage{padding:0}}
</style>
</head>
<body>
<form class="controls" aria-label="Ustawienia prototypu" onsubmit="return false">
  <label>Scenariusz / Scenario
    <select id="scenario">
      <option value="A">A — rozwiązana blokada</option>
      <option value="B">B — nowa blokada po sukcesie</option>
      <option value="C">C — brak i sprzeczność danych</option>
      <option value="D" selected>D — scalone bez wdrożenia</option>
      <option value="E">E — brak zgody właściciela</option>
      <option value="F">F — nieaktualne podsumowanie</option>
      <option value="G">G — brak zapisanego stanu</option>
      <option value="H">H — blokady jeszcze niesprawdzone</option>
      <option value="I">I — kilka otwartych blokad</option>
    </select></label>
  <label id="approvalWrap" hidden>Zatwierdzenie decyzji (E)
    <select id="approval">
      <option value="none" selected>brak zatwierdzenia</option>
      <option value="installation_token">token instalacji</option>
      <option value="owner_session">sesja właściciela</option>
    </select></label>
  <label id="policyWrap" hidden>Polityka zgody (E)
    <select id="policy">
      <option value="current" selected>obecna: token instalacji = właściciel</option>
      <option value="future">po rozdzieleniu: tylko sesja właściciela</option>
    </select></label>
  <label>Język / Language <select id="lang"><option value="pl">PL</option><option value="en">EN</option></select></label>
  <label>Motyw / Theme <select id="theme"><option value="dark">Ciemny / Dark</option><option value="light">Jasny / Light</option></select></label>
  <label>Szerokość / Width <select id="width"><option value="desktop">Desktop 1440</option><option value="mobile">Mobile 390</option><option value="narrow">Mobile 320</option></select></label>
  <p class="note">Prototyp do przeglądu — dane fikcyjne (Customer Portal). Ocena stanu (świeżość, sprzeczności, zgoda) jest liczona funkcją <code>assess()</code> według reguł z docs/knowledge-current-state-design.md, a nie wpisana ręcznie. Nie jest to komponent produkcyjny ani zatwierdzony wygląd.</p>
</form>
